[package]
name = "reluax"
version = "0.2.4"
edition = "2024"
description = "A LuaX-based web framework"
authors = ["Duckonaut"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Duckonaut/reluax"
homepage = "https://github.com/Duckonaut/reluax"
keywords = ["http", "web", "framework", "lua", "luax"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.4", features = ["derive"] }
color-eyre = "0.6"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "tokio"] }
mlua = { version = "0.12", features = ["lua54", "send", "vendored"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
utf8-read = "0.4.0"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
